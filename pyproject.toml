[project]
name = "survey-explorer"
version = "0.1.0"
description = "Cleaning pipeline, API and UI for exploring a political attitudes survey"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "streamlit>=1.66.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "frontend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Streamlit runs frontend/app.py with frontend/ on the import path
src = [".", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
